[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-agent"
version = "0.1.0"
description = "Dispute AI agent: dispute mailbox -> rules -> SOA -> Oracle Fusion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "msal>=1.28",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.16", "pypdf>=4.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dispute-agent = "dispute_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E702"]

[tool.ruff.lint.per-file-ignores]
"src/dispute_agent/api.py" = ["E501"]  # embedded review-screen HTML/JS
