name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Demo (smoke test)
        run: dispute-agent demo --mode assist

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dispute-agent:ci .
      - name: Container starts and answers /health
        run: |
          docker run -d --name agent -p 8080:8080 dispute-agent:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health && exit 0; sleep 1; done
          docker logs agent; exit 1
